# SameKeys project definition for XcodeGen.
#
# This file is the source of truth for the Xcode project. SameKeys.xcodeproj is
# generated from it and committed so a fresh clone builds with no extra tools,
# but hand edits to the .xcodeproj are lost on the next regeneration. Change
# settings here, then run:
#
#   xcodegen generate

name: SameKeys

options:
  bundleIdPrefix: com.samekeys
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

# Automatic updates (KB-101). MIT-licensed; see THIRD_PARTY_NOTICES.md.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.4"
    CURRENT_PROJECT_VERSION: "5"

targets:
  SameKeys:
    type: application
    platform: macOS
    sources:
      - path: SameKeys
        excludes:
          - Resources/Info.plist
          - Resources/Templates
      # Blank Office documents for the Finder menu, kept in a Templates folder
      # inside the app (scripts/make-office-templates.py).
      - path: SameKeys/Resources/Templates
        type: folder
        buildPhase: resources
      # Shipped inside the app, as GPL-3.0 asks of every copy handed on, and
      # shown from the About page.
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      # The Finder right-click menu (KB-210), embedded in Contents/PlugIns.
      - target: SameKeysFinder
      - package: Sparkle
    info:
      path: SameKeys/Resources/Info.plist
      properties:
        CFBundleDisplayName: SameKeys
        # Read versions from build settings so MARKETING_VERSION and
        # CURRENT_PROJECT_VERSION are the single place to bump them. Left to
        # itself XcodeGen writes a hard-coded "1.0", and Sparkle compares these.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Menu bar utility: no Dock icon and no app menu. The main window is
        # opened on demand from the menu bar item.
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        # The languages SameKeys ships in (M9). Listing them lets macOS pick
        # one per app in System Settings › General › Language & Region.
        CFBundleLocalizations: [en, zh-Hans, zh-Hant, ja, ko, de, fr, es, pt-BR, pl]
        NSHumanReadableCopyright: "Copyright © 2026 Lei Sun and SameKeys contributors. Licensed under GPL-3.0."
        # The Finder extension hands each menu choice to the app as a
        # samekeys:// URL (FinderMenuRequest).
        CFBundleURLTypes:
          - CFBundleURLName: com.samekeys.SameKeys.finder
            CFBundleURLSchemes: [samekeys]
        # Automatic updates (KB-101). The appcast is published with the
        # website; every update in it is signed with the EdDSA key whose public
        # half is below (private half: login keychain, account "keybridge").
        # Checks run daily without asking first, and nothing about the Mac is
        # sent with them.
        SUFeedURL: https://samekeys.com/appcast.xml
        SUPublicEDKey: "+mui14fQOOo10sFdbz8XnVClc/6jH9XYn9DNxEMq7nA="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUEnableSystemProfiling: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samekeys.SameKeys
        PRODUCT_NAME: SameKeys
        # Resources/AppIcon.icon, made in Icon Composer: Liquid Glass on macOS
        # 26, and actool derives the flat icon macOS 14 and 15 show (KB-106).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Global input interception cannot run inside the App Sandbox, so the
        # sandbox stays off permanently. Hardened runtime is required for
        # notarization; Xcode only applies it when signing with a real
        # identity, so ad-hoc development builds run without it.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        # Strings are extracted into Resources/Localizable.xcstrings on every
        # build; Xcode lists any a translation is missing.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # Signing is configured in xcconfig files, not here: target settings in
    # this file would override them. See Config/Signing.xcconfig.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    # Shared scheme, committed so command-line builds and CI can find it.
    scheme:
      testTargets:
        - SameKeysTests

  # The Finder right-click menu (KB-210). Finder only loads a sandboxed
  # extension, so it builds the menu and leaves the work to the app.
  SameKeysFinder:
    type: app-extension
    platform: macOS
    sources:
      - path: SameKeysFinder
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: SameKeys/FinderMenu/NewDocument.swift
    info:
      path: SameKeysFinder/Info.plist
      properties:
        CFBundleDisplayName: SameKeys Finder Menu
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "Copyright © 2026 Lei Sun and SameKeys contributors. Licensed under GPL-3.0."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).FinderSync"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samekeys.SameKeys.Finder
        PRODUCT_NAME: SameKeysFinder
        CODE_SIGN_ENTITLEMENTS: SameKeysFinder/SameKeysFinder.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_EMIT_LOC_STRINGS: NO
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig

  # Unit tests for logic that does not need a running app. The bundle compiles
  # the sources it tests itself instead of loading them from a host app, so a
  # test run never launches SameKeys or starts its event tap.
  SameKeysTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SameKeysTests
      - path: SameKeys/Rules
      - path: SameKeys/Engine/RuleMatcher.swift
      - path: SameKeys/Engine/EventTrigger.swift
      - path: SameKeys/Engine/Dispatcher.swift
      - path: SameKeys/Engine/InputSourceSwitcher.swift
      - path: SameKeys/Engine/DispatchTrace.swift
      - path: SameKeys/Engine/SyntheticEvent.swift
      - path: SameKeys/Engine/ScrollStepper.swift
      - path: SameKeys/Engine/WheelDirection.swift
      - path: SameKeys/Engine/DockClick.swift
      - path: SameKeys/Engine/CtrlClick.swift
      - path: SameKeys/Engine/ModifierTap.swift
      - path: SameKeys/Engine/TapBreaker.swift
      - path: SameKeys/Engine/KeyboardSource.swift
      - path: SameKeys/Engine/KeyboardList.swift
      - path: SameKeys/Engine/EmbeddedTerminal.swift
      - path: SameKeys/UI/KeyboardChoices.swift
      - path: SameKeys/Window/WindowGeometry.swift
      - path: SameKeys/Window/WindowAction.swift
      - path: SameKeys/FileDialog/FileDialogAction.swift
      - path: SameKeys/FileDialog/FinderRecentFolders.swift
      - path: SameKeys/FileDialog/FileLocations.swift
      - path: SameKeys/Window/WindowElement.swift
      - path: SameKeys/Permissions
      - path: SameKeys/Clipboard
      - path: SameKeys/FileDialog/PastedPath.swift
      - path: SameKeys/FileDialog/FinderFolderPicker.swift
      - path: SameKeys/App/EngineController.swift
      - path: SameKeys/App/LoginItem.swift
      - path: SameKeys/App/FeedbackLinks.swift
      - path: SameKeys/App/DiagnosticReport.swift
      - path: SameKeys/App/DiagnosticRecorder.swift
      - path: SameKeys/App/LogArchive.swift
      - path: SameKeys/FinderMenu/NewDocument.swift
      - path: SameKeys/FinderMenu/FinderMenuHandler.swift
      - path: SameKeys/FinderMenu/FinderMenuSender.swift
      - path: SameKeys/Updates/InstallLocation.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samekeys.SameKeysTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
