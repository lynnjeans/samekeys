<ul>
  <li><b>安装向导</b>：可以选择语言；最后一步可以直接打开默认关闭的功能。</li>
  <li><b>访达</b>：Ctrl+V 粘贴副本，先按 Ctrl+X 才是移动；Ctrl+Shift+N 新建文件夹。</li>
  <li><b>浏览器</b>：Ctrl+Shift+N 打开无痕窗口。</li>
  <li><b>应用内终端</b>：VS Code 等应用里的终端，Ctrl 键原样传给终端。</li>
  <li><b>滚轮缩放</b>：跟着每个键盘的 Ctrl 键走。</li>
  <li><b>Win 和 Alt 键</b>：设置改为画在键盘上，一眼看懂。</li>
  <li><b>密码框</b>：其他应用在后台占着安全输入、快捷键暂停时，菜单栏会提示是哪个应用。</li>
  <li><b>剪贴板历史</b>：远程桌面等应用复制时不再卡住按键。</li>
</ul>
